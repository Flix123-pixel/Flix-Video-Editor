<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flix Video Editor</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#08090d;
    color:white;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* TOP BAR */

.topbar{
    height:60px;
    background:#11131a;
    border-bottom:1px solid #252936;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#6c63ff;
}

.logo span{
    color:white;
}

.top-actions{
    display:flex;
    gap:10px;
}

button{
    border:0;
    border-radius:8px;
    padding:9px 14px;
    background:#20232d;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#303441;
}

.export{
    background:#6c63ff;
}

.export:hover{
    background:#584ff0;
}

/* MAIN */

.main{
    flex:1;
    display:flex;
    min-height:0;
}

/* LEFT PANEL */

.sidebar{
    width:245px;
    background:#101218;
    border-right:1px solid #252936;
    overflow:auto;
    padding:12px;
}

.tool{
    padding:13px;
    margin-bottom:7px;
    border-radius:9px;
    cursor:pointer;
    background:#171a22;
}

.tool:hover{
    background:#242734;
}

.tool b{
    display:block;
    margin-bottom:4px;
}

.tool small{
    color:#9297a7;
}

/* WORKSPACE */

.workspace{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.preview{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#050609;
    position:relative;
    overflow:hidden;
}

.preview video{
    max-width:90%;
    max-height:80%;
    background:black;
    transition:.2s;
}

.empty{
    position:absolute;
    text-align:center;
    color:#777c8b;
}

.empty h2{
    color:#bbb;
    margin-bottom:8px;
}

/* TEXT LAYER */

.text-layer{
    position:absolute;
    color:white;
    font-size:40px;
    font-weight:bold;
    text-shadow:2px 2px 8px #000;
    pointer-events:none;
    display:none;
}

/* CONTROLS */

.controls{
    height:55px;
    background:#11131a;
    border-top:1px solid #252936;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 15px;
}

.controls input[type=range]{
    flex:1;
}

/* RIGHT PANEL */

.properties{
    width:260px;
    background:#101218;
    border-left:1px solid #252936;
    overflow:auto;
    padding:14px;
}

.properties h3{
    margin-bottom:15px;
}

.prop{
    margin-bottom:18px;
}

.prop label{
    display:block;
    font-size:13px;
    color:#aaa;
    margin-bottom:7px;
}

.prop input,
.prop select{
    width:100%;
    padding:8px;
    border-radius:7px;
    border:1px solid #303440;
    background:#191c24;
    color:white;
}

/* TIMELINE */

.timeline{
    height:190px;
    background:#0d0f14;
    border-top:1px solid #292d39;
    padding:12px;
}

.timeline-head{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    color:#9da2b0;
    font-size:13px;
}

.track{
    height:55px;
    background:#171a22;
    border-radius:8px;
    position:relative;
    overflow:hidden;
}

.clip{
    position:absolute;
    top:7px;
    bottom:7px;
    left:5px;
    right:5px;
    border-radius:6px;
    background:linear-gradient(90deg,#5148db,#756dff);
    display:flex;
    align-items:center;
    padding:0 12px;
    font-weight:bold;
}

@media(max-width:800px){

    .sidebar{
        width:70px;
    }

    .tool{
        padding:10px 5px;
        text-align:center;
    }

    .tool small{
        display:none;
    }

    .tool b{
        font-size:11px;
    }

    .properties{
        width:190px;
    }
}

@media(max-width:600px){

    .sidebar{
        display:none;
    }

    .properties{
        display:none;
    }

    .timeline{
        height:150px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- TOP -->

<header class="topbar">

    <div class="logo">
        FLIX <span>VIDEO EDITOR</span>
    </div>

    <div class="top-actions">

        <button onclick="openVideo()">
            📂 Import
        </button>

        <button onclick="newProject()">
            ＋ New
        </button>

        <button class="export" onclick="exportVideo()">
            ⬇ Export
        </button>

    </div>

</header>


<!-- MAIN -->

<div class="main">

<!-- LEFT TOOLS -->

<aside class="sidebar">

    <div class="tool" onclick="openVideo()">
        <b>🎬 Media</b>
        <small>Video & images</small>
    </div>

    <div class="tool" onclick="showText()">
        <b>🔤 Text</b>
        <small>Add text</small>
    </div>

    <div class="tool" onclick="rotateVideo()">
        <b>🔄 Rotate</b>
        <small>Rotate video</small>
    </div>

    <div class="tool" onclick="flipVideo()">
        <b>↔️ Flip</b>
        <small>Mirror video</small>
    </div>

    <div class="tool" onclick="setSpeed()">
        <b>⏩ Speed</b>
        <small>Playback speed</small>
    </div>

    <div class="tool" onclick="muteVideo()">
        <b>🔇 Audio</b>
        <small>Mute / unmute</small>
    </div>

    <div class="tool" onclick="resetVideo()">
        <b>♻️ Reset</b>
        <small>Reset effects</small>
    </div>

</aside>


<!-- WORKSPACE -->

<section class="workspace">

    <div class="preview">

        <div class="empty" id="empty">

            <h2>Flix Video Editor</h2>

            <p>Import a video to start editing</p>

        </div>

        <video
            id="video"
            controls
            style="display:none">
        </video>

        <div
            id="textLayer"
            class="text-layer">
        </div>

    </div>


    <!-- VIDEO CONTROLS -->

    <div class="controls">

        <button onclick="playPause()">
            ▶
        </button>

        <span id="time">
            00:00 / 00:00
        </span>

        <input
            id="seek"
            type="range"
            min="0"
            max="100"
            value="0"
            oninput="seekVideo(this.value)">

        <button onclick="toggleMute()">
            🔊
        </button>

    </div>


    <!-- TIMELINE -->

    <div class="timeline">

        <div class="timeline-head">

            <span>Timeline</span>

            <span id="duration">
                00:00
            </span>

        </div>

        <div class="track">

            <div
                class="clip"
                id="clip">

                🎬 Video Clip

            </div>

        </div>

    </div>

</section>


<!-- PROPERTIES -->

<aside class="properties">

    <h3>Properties</h3>


    <div class="prop">

        <label>Brightness</label>

        <input
            id="brightness"
            type="range"
            min="50"
            max="150"
            value="100"
            oninput="filters()">

    </div>


    <div class="prop">

        <label>Contrast</label>

        <input
            id="contrast"
            type="range"
            min="50"
            max="150"
            value="100"
            oninput="filters()">

    </div>


    <div class="prop">

        <label>Saturation</label>

        <input
            id="saturation"
            type="range"
            min="0"
            max="200"
            value="100"
            oninput="filters()">

    </div>


    <div class="prop">

        <label>Blur</label>

        <input
            id="blur"
            type="range"
            min="0"
            max="10"
            value="0"
            oninput="filters()">

    </div>


    <div class="prop">

        <label>Aspect Ratio</label>

        <select onchange="aspect(this.value)">

            <option value="auto">Original</option>
            <option value="16/9">16 : 9</option>
            <option value="9/16">9 : 16</option>
            <option value="1/1">1 : 1</option>

        </select>

    </div>


    <div class="prop">

        <label>Volume</label>

        <input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="100"
            oninput="setVolume(this.value)">

    </div>


    <div class="prop">

        <label>Text</label>

        <input
            id="textInput"
            type="text"
            placeholder="Enter text"
            oninput="updateText()">

    </div>

</aside>

</div>

</div>


<input
    id="fileInput"
    type="file"
    accept="video/*"
    hidden>


<script>

const video = document.getElementById("video");
const fileInput = document.getElementById("fileInput");
const empty = document.getElementById("empty");
const seek = document.getElementById("seek");
const time = document.getElementById("time");
const duration = document.getElementById("duration");
const textLayer = document.getElementById("textLayer");

let videoURL = null;

let rotation = 0;
let flipped = false;


/* =========================
   IMPORT VIDEO
========================= */

function openVideo(){

    fileInput.click();

}


fileInput.addEventListener("change", function(){

    const file = this.files[0];

    if(!file) return;

    if(videoURL){

        URL.revokeObjectURL(videoURL);

    }

    videoURL = URL.createObjectURL(file);

    video.src = videoURL;

    video.style.display = "block";

    empty.style.display = "none";

    video.load();

});


/* =========================
   PLAY / PAUSE
========================= */

function playPause(){

    if(!video.src){

        alert("First import a video.");

        return;

    }

    if(video.paused){

        video.play();

    }else{

        video.pause();

    }

}


/* =========================
   TIME
========================= */

function formatTime(seconds){

    if(!isFinite(seconds)) return "00:00";

    let m = Math.floor(seconds / 60);

    let s = Math.floor(seconds % 60);

    return String(m).padStart(2,"0") + ":" +
           String(s).padStart(2,"0");

}


video.addEventListener("loadedmetadata",function(){

    duration.textContent =
        formatTime(video.duration);

});


video.addEventListener("timeupdate",function(){

    if(!video.duration) return;

    seek.value =
        (video.currentTime / video.duration) * 100;

    time.textContent =
        formatTime(video.currentTime) +
        " / " +
        formatTime(video.duration);

});


function seekVideo(value){

    if(!video.duration) return;

    video.currentTime =
        video.duration * (value / 100);

}


/* =========================
   MUTE
========================= */

function toggleMute(){

    video.muted = !video.muted;

}


function muteVideo(){

    video.muted = true;

}


function setVolume(value){

    video.volume = value / 100;

}


/* =========================
   SPEED
========================= */

function setSpeed(){

    let speed =
        prompt(
            "Enter speed:\n0.25, 0.5, 1, 1.5, 2"
        );

    speed = Number(speed);

    if(
        speed &&
        speed >= 0.25 &&
        speed <= 2
    ){

        video.playbackRate = speed;

    }

}


/* =========================
   ROTATE
========================= */

function rotateVideo(){

    rotation += 90;

    if(rotation >= 360){

        rotation = 0;

    }

    applyTransform();

}


function flipVideo(){

    flipped = !flipped;

    applyTransform();

}


function applyTransform(){

    let flip =
        flipped ? "scaleX(-1)" : "";

    video.style.transform =
        "rotate(" +
        rotation +
        "deg) " +
        flip;

}


/* =========================
   FILTERS
========================= */

function filters(){

    let b =
        document.getElementById("brightness").value;

    let c =
        document.getElementById("contrast").value;

    let s =
        document.getElementById("saturation").value;

    let blur =
        document.getElementById("blur").value;

    video.style.filter =
        "brightness(" + b + "%) " +
        "contrast(" + c + "%) " +
        "saturate(" + s + "%) " +
        "blur(" + blur + "px)";

}


/* =========================
   ASPECT RATIO
========================= */

function aspect(value){

    if(value === "auto"){

        video.style.aspectRatio = "auto";

        return;

    }

    video.style.aspectRatio = value;

}


/* =========================
   TEXT
========================= */

function showText(){

    let text =
        prompt("Enter your text:");

    if(!text) return;

    textLayer.textContent = text;

    textLayer.style.display = "block";

    document.getElementById("textInput").value = text;

}


function updateText(){

    textLayer.textContent =
        document.getElementById("textInput").value;

    if(textLayer.textContent){

        textLayer.style.display = "block";

    }else{

        textLayer.style.display = "none";

    }

}


/* =========================
   RESET
========================= */

function resetVideo(){

    rotation = 0;

    flipped = false;

    video.style.transform = "";

    video.style.filter = "";

    video.style.aspectRatio = "auto";

    video.playbackRate = 1;

    video.volume = 1;

    video.muted = false;

    document.getElementById("brightness").value = 100;

    document.getElementById("contrast").value = 100;

    document.getElementById("saturation").value = 100;

    document.getElementById("blur").value = 0;

}


/* =========================
   NEW PROJECT
========================= */

function newProject(){

    if(confirm("Start a new project?")){

        video.pause();

        video.removeAttribute("src");

        video.load();

        video.style.display = "none";

        empty.style.display = "block";

        textLayer.style.display = "none";

        fileInput.value = "";

    }

}


/* =========================
   EXPORT
========================= */

async function exportVideo(){

    if(!video.src){

        alert("Import a video first.");

        return;

    }

    alert(
        "Browser export is starting.\n\n" +
        "For advanced MP4 export, FFmpeg integration can be added."
    );

    try{

        const stream =
            video.captureStream();

        const recorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:
                    "video/webm"
                }
            );

        let chunks = [];

        recorder.ondataavailable = e => {

            if(e.data.size > 0){

                chunks.push(e.data);

            }

        };

        recorder.onstop = () => {

            const blob =
                new Blob(
                    chunks,
                    {type:"video/webm"}
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;

            a.download =
                "flix-video.webm";

            a.click();

            URL.revokeObjectURL(url);

        };


        video.currentTime = 0;

        recorder.start();

        video.play();


        video.onended = () => {

            recorder.stop();

        };

    }catch(error){

        console.error(error);

        alert(
            "Export is not supported by this browser."
        );

    }

}

</script>

</body>
  </html>
